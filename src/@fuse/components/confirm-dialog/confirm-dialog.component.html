<h1 matDialogTitle>{{'Confirm' | translate}}</h1>
<div mat-dialog-content>{{confirmMessage | translate}}</div>
<div mat-dialog-actions class="pt-24">
    <button mat-raised-button class="mat-warn mr-16" (click)="dialogRef.close(true)">{{'Confirm' | translate}}</button>
    <button mat-button  (click)="dialogRef.close(false)">{{'Cancel' | translate }}</button>
</div>

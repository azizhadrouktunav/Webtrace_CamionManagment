<div fxLayout="column" fxFlex fusePerfectScrollbar>



    <mat-list>
      

        <mat-list-item *ngFor="let event of events">
            <mat-divider></mat-divider>
            <mat-icon color="warn" mat-list-icon>warning</mat-icon>
            
            <h3 style="color: #353434 ; " matLine>{{event.FrOriginalDescription}}</h3>
            <div matLine>5089 TU 103 </div>
            <h3 mat-line>{{event.AcquisitionTimeLocalString}}</h3>
            <h3 mat-line>Rue de l'énergie atomique </h3>
            <h3 matLine> {{event.Speed}} kmh </h3>
            
            <mat-divider></mat-divider>
           
              <mat-menu  #beforeMenu="matMenu" xPosition="before" #menu="matMenu">
                <button mat-menu-item>
                  <mat-icon>dialpad</mat-icon>
                  <span>Redial</span>
                </button>
                <button mat-menu-item disabled>
                  <mat-icon>voicemail</mat-icon>
                  <span>Check voice mail</span>
                </button>
                <button mat-menu-item>
                  <mat-icon>notifications_off</mat-icon>
                  <span>Disable alerts</span>
                </button>
              </mat-menu>
        </mat-list-item>

    </mat-list>

    <mat-divider></mat-divider>

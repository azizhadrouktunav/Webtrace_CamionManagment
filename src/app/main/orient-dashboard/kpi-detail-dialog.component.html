<div class="orient-dash-dlg">
  <header class="orient-dash-dlg__header">
    <h2 class="orient-dash-dlg__title">{{ title }}</h2>
    <button mat-icon-button type="button" (click)="close()" aria-label="Fermer">
      <mat-icon>close</mat-icon>
    </button>
  </header>
  <div class="orient-dash-dlg__toolbar">
    <button mat-stroked-button type="button" *ngIf="viewingTrips" (click)="backToList()">Retour</button>
    <mat-form-field appearance="outline" class="orient-dash-dlg__filter">
      <mat-label>Filtrer</mat-label>
      <input matInput [value]="filterText" (input)="applyFilter($event)" />
    </mat-form-field>
    <span class="orient-dash-dlg__spacer"></span>
    <button mat-stroked-button type="button" (click)="exportPdf()">PDF</button>
    <button mat-stroked-button type="button" (click)="exportExcel()">Excel</button>
  </div>
  <div class="orient-dash-dlg__body">
    <ng-container *ngIf="tableOn">
      <table mat-table [dataSource]="dataSource" class="orient-table" *ngIf="dataSource.data.length">
        <ng-container *ngFor="let col of columns" [matColumnDef]="col.key">
          <th mat-header-cell *matHeaderCellDef>{{ col.label }}</th>
          <td mat-cell *matCellDef="let row">{{ row[col.key] }}</td>
        </ng-container>
        <ng-container matColumnDef="action">
          <th mat-header-cell *matHeaderCellDef>Action</th>
          <td mat-cell *matCellDef="let row">
            <button mat-button type="button" color="primary" (click)="openTrips(row)">Voir les voyages</button>
          </td>
        </ng-container>
        <tr mat-header-row *matHeaderRowDef="columnIds"></tr>
        <tr mat-row *matRowDef="let row; columns: columnIds"></tr>
      </table>
      <mat-paginator
        *ngIf="dataSource.data.length"
        [pageSize]="10"
        [pageSizeOptions]="[5, 10, 25, 50]"
        showFirstLastButtons>
      </mat-paginator>
    </ng-container>
    <p *ngIf="!dataSource.data.length">{{ empty }}</p>
    <p *ngIf="dataSource.data.length && filterText && !dataSource.filteredData.length">Aucun résultat.</p>
  </div>
  <footer class="orient-dash-dlg__footer">
    <button mat-button type="button" (click)="close()">Fermer</button>
  </footer>
</div>

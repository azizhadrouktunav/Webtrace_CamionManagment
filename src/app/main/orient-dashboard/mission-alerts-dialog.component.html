<div class="orient-dash-dlg">
  <header class="orient-dash-dlg__header">
    <h2 class="orient-dash-dlg__title">Alertes</h2>
    <button mat-icon-button type="button" (click)="close()" aria-label="Fermer">
      <mat-icon>close</mat-icon>
    </button>
  </header>
  <div class="orient-dash-dlg__toolbar">
    <mat-form-field appearance="outline" class="orient-dash-dlg__filter">
      <mat-label>Filtrer</mat-label>
      <input matInput [value]="filterText" (input)="applyFilter($event)" />
    </mat-form-field>
    <span class="orient-dash-dlg__spacer"></span>
    <button mat-stroked-button type="button" (click)="exportPdf()">PDF</button>
    <button mat-stroked-button type="button" (click)="exportExcel()">Excel</button>
  </div>
  <div class="orient-dash-dlg__body">
    <table mat-table [dataSource]="dataSource" class="orient-table" *ngIf="dataSource.data.length">
      <ng-container matColumnDef="when">
        <th mat-header-cell *matHeaderCellDef>Date et heure</th>
        <td mat-cell *matCellDef="let row">{{ row.when }}</td>
      </ng-container>
      <ng-container matColumnDef="mission">
        <th mat-header-cell *matHeaderCellDef>Mission</th>
        <td mat-cell *matCellDef="let row">{{ row.mission }}</td>
      </ng-container>
      <ng-container matColumnDef="driver">
        <th mat-header-cell *matHeaderCellDef>Chauffeur</th>
        <td mat-cell *matCellDef="let row">{{ row.driver }}</td>
      </ng-container>
      <ng-container matColumnDef="truck">
        <th mat-header-cell *matHeaderCellDef>Camion</th>
        <td mat-cell *matCellDef="let row">{{ row.truck }}</td>
      </ng-container>
      <ng-container matColumnDef="type">
        <th mat-header-cell *matHeaderCellDef>Type</th>
        <td mat-cell *matCellDef="let row">{{ row.type }}</td>
      </ng-container>
      <ng-container matColumnDef="minutes">
        <th mat-header-cell *matHeaderCellDef>Temps dépassé</th>
        <td mat-cell *matCellDef="let row">{{ row.minutes }} min</td>
      </ng-container>
      <tr mat-header-row *matHeaderRowDef="columns"></tr>
      <tr mat-row *matRowDef="let row; columns: columns"></tr>
    </table>
    <mat-paginator
      *ngIf="dataSource.data.length"
      [pageSize]="10"
      [pageSizeOptions]="[5, 10, 25, 50]"
      showFirstLastButtons>
    </mat-paginator>
    <p *ngIf="!dataSource.data.length">Aucune alerte.</p>
    <p *ngIf="dataSource.data.length && filterText && !dataSource.filteredData.length">Aucun résultat.</p>
  </div>
  <footer class="orient-dash-dlg__footer">
    <button mat-button type="button" (click)="close()">Fermer</button>
  </footer>
</div>

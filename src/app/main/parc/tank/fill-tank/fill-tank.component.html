<h1 mat-dialog-title>{{ 'FillTank' | translate}}</h1>
<div mat-dialog-content>
  
    <mat-form-field>
        <mat-label>{{ 'FillingInL' | translate}}</mat-label>
        <input matInput
               type="number"
               [formControl]="operationCapacityInL">
    </mat-form-field>
</div>
<div mat-dialog-actions>
    <button mat-button  (click)="matDialogRef.close()">{{'Cancel' | translate}}</button>
  <button  mat-button color="primary"
  class="save-button"
  (click)="matDialogRef.close(operationCapacityInL)"
  [disabled]="operationCapacityInL.invalid">{{'Update' | translate}}
</button>
</div>

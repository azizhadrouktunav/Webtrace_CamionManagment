
<div class="dialog-content-wrapper">
    <mat-toolbar class="mat-accent m-0">
        <mat-toolbar-row fxFlex fxLayout="row" fxLayoutAlign="space-between center">
            <span class="title dialog-title">{{'AffectCardCouponToDriver' | translate}}</span>
            <button mat-icon-button (click)="matDialogRef.close()" aria-label="Close dialog">
                <mat-icon>close</mat-icon>
            </button>
        </mat-toolbar-row>
    </mat-toolbar>

    <div mat-dialog-content class="p-16 pb-0 m-0" fusePerfectScrollbar>

        <form name="affectCouponForm" [formGroup]="affectCouponForm" class="event-form w-100-p" fxLayout="column" fxFlex>
                    <div fxFlex="1 0 auto" fxLayout="column" fxLayout.gt-xs="row">
                        <!--Driver-->
                        <mat-form-field appearance="outline" class="pr-sm-8" fxFlex="50">
                            <mat-label>{{ 'Driver' | translate}}</mat-label>
                            <mat-select formControlName="idDriver" >
                                <mat-option *ngFor="let driver of drivers" [value]="driver.Id">
                                  {{driver.FullName}}
                                </mat-option>
                            </mat-select>
                        </mat-form-field>
                        <!-- Vehicle -->
                        <mat-form-field appearance="outline" class="pr-sm-8" fxFlex="50">
                            <mat-label>{{'Vehicle' | translate}}</mat-label>
                            <mat-select formControlName="idUsedCar" >
                                <mat-option *ngFor="let vehicle of vehicles" [value]="vehicle.Id">
                                  {{vehicle.FullName}}
                                </mat-option>=
                            </mat-select>
                        </mat-form-field>
                    </div>
                    <div fxFlex="1 0 auto" fxLayout="column" fxLayout.gt-xs="row" formGroupName="Period">
                       
                         <mat-form-field appearance="outline" class="pr-sm-8" fxFlex="50">
                            <mat-label>{{ 'From' | translate}}</mat-label>
                            <input matInput [ngxMatDatetimePicker]="picker1" 
                                placeholder="Choose a date" formControlName="ForMissionEndDateGMT">
                            <mat-datepicker-toggle matSuffix [for]="picker1"></mat-datepicker-toggle>
                            <ngx-mat-datetime-picker #picker1></ngx-mat-datetime-picker>
                        </mat-form-field> 
                        <mat-form-field appearance="outline" class="pr-sm-8" fxFlex="50">
                            <mat-label>{{ 'To' | translate}}</mat-label>
                           <input matInput [ngxMatDatetimePicker]="picker2" 
                                 placeholder="Choose a date" formControlName="ForMissionStartDateGMT">
                           <mat-datepicker-toggle matSuffix [for]="picker2"></mat-datepicker-toggle>
                           <ngx-mat-datetime-picker #picker2></ngx-mat-datetime-picker>
                        </mat-form-field>
                    </div>
            <div fxFlex="1 0 auto" fxLayout="column" fxLayout.gt-xs="row">
                <mat-form-field appearance="outline" class="pr-sm-8" fxFlex="50">
                        <mat-label>{{ 'LittrePrice' | translate}}</mat-label>
                        <input matInput
                               name="Price of a liter"
                               formControlName="PricePerL"
                               type="number">
                </mat-form-field>
                <mat-form-field appearance="outline" class="pr-sm-8" fxFlex="50">
                    <mat-label>{{'Description' | translate}}</mat-label>
                    <input matInput
                           name="Description"
                           formControlName="Description"
                           type="text">
                </mat-form-field>
            </div>
        </form>
    </div>

    <div mat-dialog-actions class="m-0 p-16" fxLayout="row" fxLayoutAlign="end center">
   
        <button mat-button color="primary"
                class="save-button"
                (click)="confirmDialog()"
                [disabled]="affectCouponForm.invalid"
                aria-label="SAVE">
                {{'Save' | translate}}
        </button>
    </div>
</div>

<!-- main app container -->
<div class="dialog-content-wrapper">
    <mat-toolbar class="mat-accent m-0">
        <mat-toolbar-row fxFlex fxLayout="row" fxLayoutAlign="space-between center">
            <span class="title dialog-title">{{'NAV.RenewContract' | translate}}</span>
            <button mat-icon-button (click)="dialogRef.close()" aria-label="Close dialog">
                <mat-icon>close</mat-icon>
            </button>
        </mat-toolbar-row>
    </mat-toolbar>
  
    <div mat-dialog-content class="p-16 pb-0 m-0" fusePerfectScrollbar>
        <form [formGroup]="renewForm" >
            <div fxLayout="row">
            
                <mat-form-field appearance="outline" class="w-100-p">
                    <mat-label>{{'NAV.NextPayment' | translate}}</mat-label>
                    <input matInput [matDatepicker]="picker" formControlName="NextRenewDate" >
                    <mat-datepicker-toggle matSuffix [for]="picker" ></mat-datepicker-toggle>
                    <mat-datepicker #picker></mat-datepicker>
                  </mat-form-field>
            </div>
            
                  
              
           
                   <div mat-dialog-actions class="m-0 p-16" fxLayout="row" fxLayoutAlign="end center">
  
                   <button mat-raised-button color="button" type="submit" class="button" (click)="onSubmit(false)" >Résilier</button>
                   <button mat-raised-button  type="submit" class="button" [disabled]="!renewForm.valid" (click)="onSubmit(true)" >Renouveler</button>

            
                </div>
        </form>
       
    </div>
    
  </div>

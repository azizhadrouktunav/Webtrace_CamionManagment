<table mat-table [dataSource]="dataSource" style="width: 100%;">
    <ng-container matColumnDef="date">
      <th mat-header-cell *matHeaderCellDef>  Date d'envoi </th>
      <td mat-cell *matCellDef="let element"> {{element.DateCommandString}} </td>
    </ng-container>
  
    
    <ng-container matColumnDef="vehicule">
      <th mat-header-cell *matHeaderCellDef> Vehicule </th>
      <td mat-cell *matCellDef="let element"> {{element.Fleet}} </td>
    </ng-container>
  
    
    <ng-container matColumnDef="type">
      <th mat-header-cell *matHeaderCellDef> Type de commande </th>
      <td mat-cell *matCellDef="let element"> {{element.CommandDescription}} </td>
    </ng-container>
  
   
    <ng-container matColumnDef="status">
      <th mat-header-cell *matHeaderCellDef> Etat </th>
      <td mat-cell *matCellDef="let element"> {{element.StatusCommandString}} </td>
    </ng-container>
  
    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;" [class.make-yellow]="row.StatusCommand == 1" [class.make-red]="row.StatusCommand == 2"></tr>
</table>

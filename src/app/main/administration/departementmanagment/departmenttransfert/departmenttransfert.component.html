<!-- main app container -->
<div class="dialog-content-wrapper">
    <mat-toolbar class="mat-accent m-0">
        <mat-toolbar-row fxFlex fxLayout="row" fxLayoutAlign="space-between center">
            <span class="title dialog-title"> {{'NAV.deleteDepartment' | translate}}</span>
            <button mat-icon-button (click)="dialogRef.close()" aria-label="Close dialog">
                <mat-icon>close</mat-icon>
            </button>
        </mat-toolbar-row>
    </mat-toolbar>
  
    <div mat-dialog-content class="p-16 pb-0 m-0" fusePerfectScrollbar>
        <form [formGroup]="Form" >
            <h4>
                {{'NAV.msgTransfertDepartementAfterDeleting' | translate}}
            </h4>
            <div fxLayout="row">
            
                <mat-form-field floatLabel="always" class="mr-sm-12" fxFlex appearance="outline">

                    <mat-label>{{'NAV.department' | translate}}</mat-label>
                    <mat-select     formControlName="Department">
                        <mat-option *ngFor="let Dep of data"  [value]="Dep.Id">{{Dep.Name}}
                        </mat-option>
                    </mat-select>
    
                    <mat-error>Selecter Department</mat-error>
                </mat-form-field>
                   </div>
            
                  
              
           
                   <div mat-dialog-actions class="m-0 p-16" fxLayout="row" fxLayoutAlign="end center">
  
                   <button mat-raised-button color="button" type="submit" class="button" (click)="onSubmit(false)" >     {{'NAV.deleteWithoutTransferDepartment' | translate}}
                </button>
                   <button mat-raised-button  type="submit" class="button" (click)="onSubmit(true)" >  {{'NAV.deleteWithTransferDepartment' | translate}}
                </button>

            
                </div>
        </form>
       
    </div>
    
  </div>

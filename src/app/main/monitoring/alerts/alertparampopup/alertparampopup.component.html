<form name="alertForm" [formGroup]="alertForm" >
  <div fxLayout="row">
               <div fxFlex="600px" fxLayout="column" fxLayout.gt-xs="row" >

    <mat-form-field appearance="outline" class="pr-4" fxFlex="50">
      <mat-label>{{'NAV.TrackingObject' | translate}}</mat-label>
      <input type="text" aria-label="Select Vehicles" matInput [matAutocomplete]="autoGroup" formControlName="Car" >
        <mat-autocomplete [panelWidth]="'auto'" #autoGroup="matAutocomplete" [displayWith]="displayVehicle">
          <mat-optgroup *ngFor="let group of CarGroupOptions | async" >
            <div>
              <mat-checkbox [checked]="group.selected" (change)="toggleParent($event, group)" 
                (click)="$event.stopPropagation()" >
                  {{group.department}}
              </mat-checkbox>
              <button mat-button (click)="expandDocumentTypes(group)">
                <mat-icon>keyboard_arrow_down</mat-icon>
              </button>
              </div>  
              <mat-option *ngFor="let name of group.car" [value]="name"
                 [ngClass]="isExpandCategory[group.department] ? 'list-show' : 'list-hide'">
                 <mat-checkbox [checked]="group.checked ? true : name.checked" (change)="toggleSelection2($event, name, group)" 
          (click)="$event.stopPropagation()">
            {{name.FullName}}
        </mat-checkbox>
              </mat-option>
        </mat-optgroup>
      </mat-autocomplete>
    </mat-form-field>
    <!-- <mat-form-field appearance="outline" class="pl-8" fxFlex="50">
        <mat-label>{{'Alert.AlertType' | translate }}</mat-label>
        <mat-select name="type" formControlName="type">
            <mat-option *ngFor="let type of types_alert" [value]="type.value">
               {{type.viewValue | translate }}
            </mat-option>
       </mat-select>
    </mat-form-field> -->
   <!--  <mat-autocomplete [panelWidth]="'auto'" #auto2="matAutocomplete" >
      <app-select-check-all [model]="form.get('Emplacementlist')" [values]="emp.value"[displayWith]="displayType">
      </app-select-check-all> 
      <mat-option *ngFor="let type of types_alert | async" [value]="type">
          <div>
              <mat-checkbox [checked]="type.selected" (change)="toggleSelectionemp(type)" (click)="$event.stopPropagation()">selectionChange)="selectType($event)"
                {{type.viewValue | translate }}
              </mat-checkbox>
          </div>
      </mat-option>
  </mat-autocomplete>-->
  <mat-form-field  appearance="outline" class="pr-4" fxFlex="50">
    <mat-label>{{'Alert.AlertType' | translate }}</mat-label>
    <mat-select  multiple formControlName="type" (selectionChange)="selectType($event)">
      <mat-option *ngFor="let types of types_alert" [value]="types.value">{{types.viewValue | translate }}</mat-option>
    </mat-select>
  </mat-form-field>
</div>
</div>
<div fxLayout="row">
  <div fxFlex="1 0 auto" fxLayout="column" fxLayout.gt-xs="row" >
 
    <mat-form-field appearance="outline" class="pl-8" fxFlex="50">
        <mat-label>{{'NAV.StartDate' | translate }}</mat-label>
        <input matInput [ngxMatDatetimePicker]="start_picker" 
                        placeholder="Choose a date" 
                        formControlName="start">
        <mat-error *ngIf="alertForm.get('start').hasError('mustBeMoreThan') && (alertForm.get('start').dirty || alertForm.get('start').touched)
                         && (alertForm.get('end').dirty || alertForm.get('end').touched)">
                {{'Common.Month_max_between_start_end' | translate }}
        </mat-error>
        <mat-datepicker-toggle matSuffix [for]="start_picker">
        </mat-datepicker-toggle>
        <ngx-mat-datetime-picker #start_picker
                                 enableMeridian = "true"
                                 showSeconds="true">
        </ngx-mat-datetime-picker>
      </mat-form-field>

      <mat-form-field appearance="outline" class="pl-8" fxFlex="50">
        <mat-label>{{'NAV.EndDate' | translate }}</mat-label>
        <input name="end" matInput [ngxMatDatetimePicker]="end_picker" 
                        placeholder="Choose a date" 
                        formControlName="end">
        <mat-datepicker-toggle matSuffix [for]="end_picker">
        </mat-datepicker-toggle>
        <ngx-mat-datetime-picker #end_picker
                                 enableMeridian = "true"
                                 showSeconds="true">
        </ngx-mat-datetime-picker>
      </mat-form-field>
      </div></div>
      <div class="px-24 pb-12" fxLayout="row" fxLayoutAlign="end center">
        <button mat-raised-button
                class="mat-primary compose-dialog-button w-100-p"
                (click)="matDialogRef.close([alertForm, types]);"
                aria-label="Submit">
             {{'appliquer' | translate}}
        </button>
      </div>
</form> 
</div>

<meta http-equiv="Cache-control" content="public">

<div id="products" class="page-layout MainContainer carded fullwidth inner-scroll">

    <!-- TOP BACKGROUND -->
    <div class="top-bg accent"></div>
    <!-- / TOP BACKGROUND -->

    <!-- CENTER -->
    <div class="center">

        <!-- HEADER -->
        <div class="header accent" fxLayout="column" fxLayoutAlign="space-around center" fxLayout.gt-sm="row"
        fxLayoutAlign.gt-sm="space-between center">

            <!-- APP TITLE -->
            <div class="logo mb-24 mb-md-0 WindowTitle" fxLayout="row" fxLayoutAlign="start center">
                
                <mat-icon>sms_failed</mat-icon>
                <span class="h1">
                    {{'NAV.smsmailconfig' | translate}} 

                </span>
            </div>
            <!-- / APP TITLE -->


            <!-- SEARCH -->
            <div class="search-wrapper mx-32 mx-md-0 primary-50-bg">
                <div class="search">
                    <input id="searchBtn" #filter placeholder="Filtrer les données"  (keyup)="applyfilter()" [(ngModel)]="searchkey" required>
                    <label for="searchBtn">
                        <mat-icon class="grey-700-fg">search</mat-icon>
                    </label>
                </div>
            </div>
            <!-- / SEARCH -->

            
           
          <!-- ADD BUTTON -->
          <button mat-fab color="warn" class="add-button" (click)="addmail()"
                aria-label="Add account" >
                <mat-icon>add</mat-icon>
            </button>
            <!-- / ADD BUTTON -->
            
        </div>
        <!-- / HEADER -->

        <!-- CONTENT CARD -->
        <div id="ExampleTable" #ExampleTable class="content-card">

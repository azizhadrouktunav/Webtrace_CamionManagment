

    <div id="report" class="page-layout simple right-sidebar inner-scroll">

        <div class="center" fxFlex>

            <div class="header accent p-24" >
    
               
    
               
                <div fxLayout="column" fxLayoutAlign="start start">
                    <span class="h2">

                        <div class="logo mb-24 mb-md-0 WindowTitle" fxLayout="row" fxLayoutAlign="start center">
    
                            <button mat-icon-button [routerLink]="'/pompe-monitoring/report'">
                                <mat-icon>arrow_back</mat-icon>
                            </button>
                            <span class="logo-text h1">
                                Rapport des pompes
                            </span>
                        </div>
                        <!-- / APP TITLE -->
                    </span>
                    <span class="h5 secondary-text"> {{'NAV.Dashboard' | translate}}
                        {{CarMatricule}} {{'NAV.Between' | translate}}
                        {{startdate | localizedDate}}    {{'NAV.and' | translate}} {{enddate| localizedDate}}
                    </span>
                </div>
                <div fxLayout="row" fxLayoutAlign="start center">
                    <div class="exportIcon">
                        <img (click)="downloadPdf()"  src="../../../../assets/icons/pdf.webp" class="pdf" title="Export as pdf file" height="50px">
                        <img  src="../../../../assets/icons/excel.png" class="excel" title="Export as excel file" height="50px">
                    </div>
                </div>
    
            
    
               
    
            </div>

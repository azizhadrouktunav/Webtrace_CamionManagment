<div id="products" class="page-layout MainContainer carded fullwidth inner-scroll">

    <!-- TOP BACKGROUND -->
    <div class="top-bg accent"></div>
    <!-- / TOP BACKGROUND -->

    <!-- CENTER -->
    <div class="center">
        <!-- HEADER -->
        <div class="header accent" fxLayout="row" fxLayoutAlign="space-between center">

            <!-- APP TITLE -->
            <div class="logo mb-24 mb-md-0 WindowTitle" fxLayout="row" fxLayoutAlign="start center">
                
                <mat-icon>person_outline</mat-icon>
                <span class="h1">
                  {{'NAV.PompisteManagement' | translate }}
                </span>
            </div>
            <!-- / APP TITLE -->

            <!-- SEARCH -->
            <div class="search-wrapper mx-32 mx-md-0 primary-50-bg">
                <div class="search">
                    <input id="searchBtn" #filter placeholder="Filtrer les données" (keyup)="applyfilter()" [(ngModel)]="searchkey" required>
                    <label for="searchBtn"><mat-icon class="grey-700-fg">search</mat-icon></label>
                </div>
            </div>
            <!-- / SEARCH -->
            

            <button mat-fab color="warn" class="add-button" (click)="addPompiste()" aria-label="Add Pompiste" >
                <mat-icon>add</mat-icon>
            </button>


        </div>
        <!-- / HEADER -->

        <!-- CONTENT CARD -->
        <div class="content-card">
            <mat-table class="Pompistes_table"  #table [dataSource]="dataSource"
                  matSort
                  [@animateStagger]="{value:'50'}"
                  fusePerfectScrollbar>

                <!-- Name Column -->
                <ng-container matColumnDef="firstname">
                    <mat-header-cell *matHeaderCellDef mat-sort-header>{{ 'NAV.Prénom' | translate }}</mat-header-cell>
                    <mat-cell *matCellDef="let Pompiste">
                        <p class="text-truncate">
                            {{Pompiste.FirstName}}

                        </p>
                    </mat-cell>
                </ng-container>
                <!-- lastname Column -->
                <ng-container matColumnDef="lastname">
                    <mat-header-cell *matHeaderCellDef mat-sort-header>{{'NAV.Family_name' | translate }}</mat-header-cell>
                    <mat-cell *matCellDef="let Pompiste">
                        <p class="text-truncate">
                            {{Pompiste.LastName}}
                        </p>
                    </mat-cell>
                </ng-container>

                 <!-- CardId Column -->
                 <ng-container matColumnDef="CardId">
                    <mat-header-cell *matHeaderCellDef mat-sort-header>Identifiant</mat-header-cell>
                    <mat-cell *matCellDef="let Pompiste">
                        <p class="text-truncate">
                            {{Pompiste.CardId}}
                        </p>
                    </mat-cell>
                </ng-container>

                  
    
   
    

    <!-- Action Column -->
    <ng-container matColumnDef="actions">
        <mat-header-cell *matHeaderCellDef mat-sort-header></mat-header-cell>
        <mat-cell *matCellDef="let Pompiste">
            <div fxLayout="row" fxLayoutAlign="space-between">
                <button mat-button-toggle mat-icon-button color="accent" (click) = "updatePompiste(Pompiste)"><mat-icon>edit</mat-icon></button>
                <button mat-button-toggle mat-icon-button color="warn"(click)="deletePompiste(Pompiste)" ><mat-icon>delete</mat-icon></button>
            </div>
        </mat-cell>
    </ng-container>
    <mat-header-row *matHeaderRowDef="displayedColumns; sticky:true"></mat-header-row>
    <mat-row *matRowDef="let Pompiste; columns: displayedColumns;"
              class="order"
             matRipple>
</mat-row>
            </mat-table>

            <mat-paginator #paginator
            [length]="dataSource.filteredData.length"
            [pageIndex]="0"
            [pageSize]="10"
            [pageSizeOptions]="[5, 10, 25, 100]">
</mat-paginator>
        </div>
           
        <!-- / CONTENT CARD -->
    </div>
    <!-- / CENTER -->
</div>

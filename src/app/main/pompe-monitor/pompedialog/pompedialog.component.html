<div class="dialog-content-wrapper">
    <mat-toolbar matDialogTitle class="mat-accent m-0">
        <mat-toolbar-row fxLayout="row" fxLayoutAlign="space-between center">
            <span class="title dialog-title">{{dialogTitle}}</span>
            <button mat-icon-button (click)="matDialogRef.close()" aria-label="Close dialog">
                <mat-icon>close</mat-icon>
            </button>
        </mat-toolbar-row>

    
    </mat-toolbar>

    <mat-dialog-content class="p-16 pb-0 m-0" fusePerfectScrollbar>

        <form [formGroup]="pompeForm" class="pompe-form w-100-p" fxLayout="column" fxFlex>

            <div  fxFlex="1 0 auto" fxLayout="column" fxLayout.gt-xs="row">

                <mat-form-field appearance="outline" class="pr-sm-8" fxFlex="100">
                    <mat-label>{{'Name' | translate }}</mat-label>
                    <input name="name" formControlName="name" matInput required>
                    <mat-error *ngIf="pompeForm.controls['name'].hasError('required')">
                        Name is required
                    </mat-error>
                    <mat-error *ngIf="pompeForm.controls['name'].hasError('unavailable')">
                        {{'Common.msgError' | translate }}
                    </mat-error>
                </mat-form-field>

               
            </div>

            
            <div fxFlex="1 0 auto" fxLayout="column" fxLayout.gt-xs="row">
                
                <mat-form-field appearance="outline" class="pr-sm-8" fxFlex="50">
                    <mat-label>{{'NAV.GasStationAttendant' | translate }}</mat-label>
                    <mat-select formControlName="pompiste"
                                required>
                        <mat-option *ngFor="let p of pompistes"
                                    [value]="p.Id">
                            {{p.FirstName}}  {{p.LastName}}  
                        </mat-option>
                    </mat-select>
                </mat-form-field>
                <mat-form-field appearance="outline" class="pr-sm-8" fxFlex="50">
                    <mat-label>{{'Equipment' | translate }}</mat-label>
                    <input formControlName="equipment" type="number" matInput>
                   
                </mat-form-field>
            </div>


           

        </form>

    </mat-dialog-content>

    <div mat-dialog-actions class="m-0 p-16" fxLayout="row" fxLayoutAlign="end center">

       
        <button *ngIf="action !== 'edit'"
                mat-button
                class="save-button"
                (click)="matDialogRef.close(pompeForm)"
                [disabled]="pompeForm.invalid"
                aria-label="SAVE">
             {{'Common.Add' | translate }}
        </button>

        <button *ngIf="action === 'edit'"
                mat-button
                class="save-button"
                (click)="matDialogRef.close(['save',pompeForm])"
                [disabled]="pompeForm.invalid"
                aria-label="SAVE">
              {{'Common.Save' | translate }}
        </button>

    </div>
</div>

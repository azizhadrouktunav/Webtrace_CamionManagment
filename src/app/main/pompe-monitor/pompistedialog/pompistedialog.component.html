<div class="dialog-content-wrapper">
    <mat-toolbar matDialogTitle class="mat-accent m-0">
        <mat-toolbar-row fxLayout="row" fxLayoutAlign="space-between center">
            <span class="title dialog-title">{{dialogTitle}}</span>
            <button mat-icon-button (click)="matDialogRef.close()" aria-label="Close dialog">
                <mat-icon>close</mat-icon>
            </button>
        </mat-toolbar-row>

    
    </mat-toolbar>

    <mat-dialog-content class="p-16 pb-0 m-0" fusePerfectScrollbar>

        <form [formGroup]="pompisteForm" class="pompiste-form w-100-p" fxLayout="column" fxFlex>

            <div  fxFlex="1 0 auto" fxLayout="column" fxLayout.gt-xs="row">

                <mat-form-field appearance="outline" class="pr-sm-8" fxFlex="100">
                    <mat-label>{{'Prénom' | translate }}</mat-label>
                    <input name="name" formControlName="firstname" matInput required>
                   
                </mat-form-field>

               
            </div>

            
            <div fxFlex="1 0 auto" fxLayout="column" fxLayout.gt-xs="row">
                <mat-form-field appearance="outline" class="pr-sm-8" fxFlex="50">
                    <mat-label>{{'NAV.Family_name' | translate }}</mat-label>
                    <input name="nickname" formControlName="lastname"  matInput>
                </mat-form-field>

                <mat-form-field appearance="outline" class="pr-sm-8" fxFlex="50">
                    <mat-label>Identifiant</mat-label>
                    <input formControlName="CardId"  matInput>
                   
                </mat-form-field>
            </div>


           

        </form>

    </mat-dialog-content>

    <div mat-dialog-actions class="m-0 p-16" fxLayout="row" fxLayoutAlign="end center">

       
        <button *ngIf="action !== 'edit'"
                mat-button
                class="save-button"
                (click)="matDialogRef.close(pompisteForm)"
                [disabled]="pompisteForm.invalid"
                aria-label="SAVE">
             {{'Common.Add' | translate }}
        </button>

        <button *ngIf="action === 'edit'"
                mat-button
                class="save-button"
                (click)="matDialogRef.close(['save',pompisteForm])"
                [disabled]="pompisteForm.invalid"
                aria-label="SAVE">
              {{'Common.Save' | translate }}
        </button>

    </div>
</div>
